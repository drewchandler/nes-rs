name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CC: gcc
      # minifb 0.9 uses XKB functions without including their declarations.
      # Define GNU features before the forced header also reaches bundled SDL.
      CFLAGS: -D_GNU_SOURCE -include X11/XKBlib.h
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxext-dev libxfixes-dev
      - name: Build native targets
        run: cargo build --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked --all-targets

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site
        run: ./scripts/build-web.sh
      - name: Check JavaScript syntax
        run: node --input-type=module --check < web/app.js
      - name: Exercise the compiled Wasm interface
        run: node scripts/check-web.mjs
