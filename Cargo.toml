[package]
name = "nes-rs"
version = "0.1.0"
authors = ["Drew Chandler <andrewschandler@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blip_buf = "0.1.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.9.0"
sdl2 = { version = "0.37.0", features = ["bundled", "static-link"] }
